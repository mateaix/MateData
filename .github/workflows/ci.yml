name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: matedata_test
          POSTGRES_USER: matedata_test
          POSTGRES_PASSWORD: ci-admin-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matedata_test -d matedata_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: matedata_test
          MYSQL_ROOT_PASSWORD: ci-admin-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MATEDATA_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/matedata_test
      MATEDATA_TEST_POSTGRES_USER: matedata_reader
      MATEDATA_TEST_POSTGRES_PASSWORD: ci-reader-only
      MATEDATA_TEST_POSTGRES_ADMIN_URL: jdbc:postgresql://127.0.0.1:5432/matedata_test
      MATEDATA_TEST_POSTGRES_ADMIN_USER: matedata_test
      MATEDATA_TEST_POSTGRES_ADMIN_PASSWORD: ci-admin-only
      MATEDATA_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/matedata_test
      MATEDATA_TEST_MYSQL_USER: matedata_reader
      MATEDATA_TEST_MYSQL_PASSWORD: ci-reader-only
      MATEDATA_TEST_MYSQL_TYPE_TABLE: tiny_alias_capacity_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.10.0'
          cache: npm
          cache-dependency-path: matedata-ui/package-lock.json
      - name: Provision disposable database fixtures
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U matedata_test -d matedata_test < scripts/ci/postgres.sql
          docker exec -i -e MYSQL_PWD=ci-admin-only "$MYSQL_CONTAINER" mysql --default-character-set=utf8mb4 -uroot < scripts/ci/mysql.sql
      - name: Test and package the single-origin application
        run: ./scripts/build.sh
      - name: Require successful real-database contracts without skips
        run: python3 scripts/ci/check_database_reports.py
      - name: Verify bundled UI and executable manifest
        shell: bash
        run: |
          jar tf matedata-server/target/matedata-server-0.1.0-SNAPSHOT.jar > /tmp/matedata-jar-entries
          grep -q '^BOOT-INF/classes/static/index.html$' /tmp/matedata-jar-entries
          grep -q '^BOOT-INF/classes/static/assets/.*\.js$' /tmp/matedata-jar-entries
          unzip -p matedata-server/target/matedata-server-0.1.0-SNAPSHOT.jar META-INF/MANIFEST.MF > /tmp/matedata-manifest
          grep -q '^Main-Class: org.springframework.boot.loader.launch.JarLauncher' /tmp/matedata-manifest
      - name: Smoke test packaged application, restart and backup restore
        run: python3 scripts/smoke.py
